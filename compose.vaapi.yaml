# ─── VA-API (Mesa / AMD / open-source Intel) overlay ─────────────────────────
# Usage:
#   docker compose -f compose.yaml -f compose.vaapi.yaml up
#
# Host requirements:
#   - /dev/dri present (renderD128 etc.)
services:
  app:
    environment:
      HW_ACCEL_TYPE: vaapi
    devices:
      - /dev/dri:/dev/dri
