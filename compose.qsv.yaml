# ─── Intel QSV overlay ────────────────────────────────────────────────────────
# Usage:
#   docker compose -f compose.yaml -f compose.qsv.yaml up
#
# Host requirements:
#   - /dev/dri present (renderD128 etc.)
#   - Kernel i915 module loaded
services:
  app:
    environment:
      HW_ACCEL_TYPE: qsv
    devices:
      - /dev/dri:/dev/dri
