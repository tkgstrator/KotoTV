services:
  mirakc:
    image: mirakc/mirakc:latest
    volumes:
      - ./config/mirakc:/etc/mirakc
      - epg-data:/var/lib/mirakc
    devices:
      - /dev/dvb
    restart: unless-stopped

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: telemax
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d telemax"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  app:
    build: .
    depends_on:
      mirakc:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD}@postgres:5432/telemax
      MIRAKC_URL: http://mirakc:40772
      PORT: ${PORT:-11575}
      HW_ACCEL_TYPE: ${HW_ACCEL_TYPE:-none}
      CODEC: ${CODEC:-avc}
      HLS_DIR: ${HLS_DIR:-/app/data/hls}
      HLS_IDLE_KILL_MS: ${HLS_IDLE_KILL_MS:-15000}
      RECORDINGS_DIR: ${RECORDINGS_DIR:-/app/data/recordings}
    tmpfs:
      - /app/data/hls:size=512M,mode=0755,exec
    volumes:
      - ./config/kototv.yaml:/app/config/kototv.yaml:ro
      - recordings:/app/data/recordings
      - encoded:/app/data/encoded
    ports:
      - "${PORT:-11575}:${PORT:-11575}"
    restart: unless-stopped

    # ── HW acceleration ─────────────────────────────────────────────────────
    # The image ships with nvenc + vaapi + qsv compiled in.
    # Set HW_ACCEL_TYPE above and use the matching overlay:
    #   NVENC:  docker compose -f compose.yaml -f compose.nvenc.yaml up
    #   VA-API: docker compose -f compose.yaml -f compose.vaapi.yaml up
    #   QSV:    docker compose -f compose.yaml -f compose.qsv.yaml up

volumes:
  epg-data:
  postgres-data:
  recordings:
  encoded:
