# ─── NVIDIA NVENC overlay ─────────────────────────────────────────────────────
# Usage:
#   docker compose -f compose.yaml -f compose.nvenc.yaml up
#
# Host requirements:
#   - nvidia-container-toolkit installed and configured
#   - NVIDIA driver >= 520
services:
  app:
    runtime: nvidia
    environment:
      HW_ACCEL_TYPE: nvenc
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, video]
